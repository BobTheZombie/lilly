name: Meson C build and PID 1 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build libpam0g-dev
      - run: CC=${{ matrix.compiler }} meson setup build --prefix=/usr
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - run: meson install -C build --destdir "$PWD/stage"
      - run: test -x stage/usr/bin/lilly && test ! -e stage/sbin/init
      - run: CC=${{ matrix.compiler }} meson setup build-ubsan -Db_sanitize=undefined
      - run: meson test -C build-ubsan --print-errorlogs
  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install VM dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build qemu-system-x86 busybox-static linux-image-generic gnu-efi ovmf libpam0g-dev udev libpam-modules util-linux
      - name: Configure QEMU tests
        run: |
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -n1)
          test -n "$kernel"
          sudo chmod a+r "$kernel"
          meson setup build -Dvm_tests=true -Dvm_kernel="$kernel" -Dvm_busybox="$(command -v busybox)" \
            -Defi=true -Defi_vm_tests=true -Dpam=enabled -Ddevice_vm_tests=true \
            -Dvm_udevd=/usr/lib/systemd/systemd-udevd -Dvm_udevadm="$(command -v udevadm)" \
            -Dovmf_code=/usr/share/OVMF/OVMF_CODE_4M.fd -Dovmf_vars=/usr/share/OVMF/OVMF_VARS_4M.fd
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lilly-boot-logs
          path: build/vm-logs/
  native-engines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone engine build and guest dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-jinja2 gperf pkgconf patchelf \
            libcap-dev libmount-dev libblkid-dev libkmod-dev libacl1-dev libaudit-dev \
            libseccomp-dev libpam0g-dev libpam-modules libpolkit-gobject-1-dev \
            dbus util-linux qemu-system-x86 busybox-static linux-image-generic
      - name: Verify vendored sources
        run: |
          test -f vendor/udev/meson.build
          test -f vendor/logind/meson.build
      - name: Configure native source profile
        run: |
          kernel=$(find /boot -maxdepth 1 -name 'vmlinuz-*' | sort -V | tail -n1)
          sudo chmod a+r "$kernel"
          meson setup build-full -Dpam=enabled -Dnative_engines=true -Dengine_jobs=2 \
            -Dengine_sources="$PWD/vendor" -Dvm_tests=true \
            -Dvm_kernel="$kernel" -Dvm_busybox="$(command -v busybox)" \
            -Dnative_engine_vm_tests=true -Dnative_engine_stage="$PWD/stage-full"
      - run: meson compile -C build-full
      - run: meson install -C build-full --destdir "$PWD/stage-full"
      - run: meson test -C build-full --print-errorlogs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lilly-native-engine-logs
          path: build-full/vm-logs/
